<title>巴塞罗那德国馆</title>
<style>
/* Layout: the building fills the screen; a narrow stone-coloured caption card on the left, controls along the bottom edge.
   Palette taken from the pavilion's own materials: travertine, onyx gold, Tinian green, chrome. */
:root {
  --ink: #f3eee4;
  --ink-dim: #c9c1b2;
  --panel: rgba(28, 30, 28, .72);
  --line: rgba(243, 238, 228, .16);
  --onyx: #d9a85b;
  --bg: #121412;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-latin: "Cormorant Garamond", "Times New Roman", serif;
  --f-ui: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;

}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--f-ui); overflow: hidden; -webkit-user-select: none; user-select: none; }
#gl { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.panel { background: var(--panel); border: 1px solid var(--line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
#card { position: fixed; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); width: min(340px, calc(100% - 32px)); box-sizing: border-box; padding: 16px 18px 15px; border-radius: 4px; }
#card .eyebrow { font: italic 500 15px/1 var(--f-latin); color: var(--onyx); letter-spacing: .04em; }
#card h1 { margin: 6px 0 2px; font: 600 24px/1.2 var(--f-display); letter-spacing: .08em; text-wrap: balance; }
#card .sub { color: var(--ink-dim); font-size: 12px; letter-spacing: .03em; }
#card hr { border: 0; border-top: 1px solid var(--line); margin: 12px 0 10px; }
#card h2 { margin: 0 0 4px; font: 600 15px/1.3 var(--f-display); letter-spacing: .06em; color: var(--ink); }
#card p { margin: 0; color: var(--ink-dim); font-size: 13px; line-height: 1.65; }
#bar { position: fixed; left: 16px; right: 16px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; pointer-events: none; }
#bar > * { pointer-events: auto; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 4px; }
.seg button, .chips button { font: 500 13px/1 var(--f-ui); color: var(--ink-dim); background: transparent; border: 0; border-radius: 3px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--onyx); color: #1d1a14; }
.seg button:hover:not([aria-pressed="true"]), .chips button:hover { color: var(--ink); background: rgba(255, 255, 255, .07); }
button:focus-visible { outline: 2px solid var(--onyx); outline-offset: 2px; }
.chips { display: flex; gap: 2px; padding: 4px; overflow-x: auto; max-width: 100%; box-sizing: border-box; scrollbar-width: none; border-radius: 4px; }
.chips::-webkit-scrollbar { display: none; }
.chips button.on { color: var(--onyx); box-shadow: inset 0 -2px 0 var(--onyx); }
#hint { position: fixed; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); padding: 9px 13px; font-size: 12px; color: var(--ink-dim); max-width: 280px; border-radius: 4px; }
#hint b { color: var(--ink); font-weight: 600; }
#joy { position: fixed; left: 26px; bottom: calc(118px + env(safe-area-inset-bottom, 0px)); width: 112px; height: 112px; border-radius: 50%; border: 1px solid var(--line); background: rgba(28, 30, 28, .4); touch-action: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(217, 168, 91, .85); }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 9; transition: opacity .7s; text-align: center; }
#loading div { font: 600 26px var(--f-display); letter-spacing: .14em; }
#loading small { display: block; margin-top: 10px; font: italic 16px var(--f-latin); color: var(--onyx); letter-spacing: .05em; }
#loading span { display: block; margin-top: 14px; font: 12px var(--f-ui); color: var(--ink-dim); letter-spacing: .05em; }
@media (max-width: 720px) {
  #hint { display: none; }
  #card { padding: 12px 14px; }
  #card h1 { font-size: 19px; }
  #card p { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { #loading { transition: none; } }

<canvas id="gl" tabindex="0" aria-label="巴塞罗那德国馆三维模型"></canvas>

<div id="card" class="panel">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
/* ================= copy ================= */
const SPOTS = [
  { n: '全景', mode: 'orbit', t: [-3, 1.5, 0], r: 66, th: .62, ph: 1.0,
    d: '1929 年巴塞罗那国际博览会的德国国家馆，由路德维希·密斯·凡·德·罗与莉莉·赖希设计。博览会结束后拆除，1983 至 1986 年在原址按原设计重建。' },
  { n: '入口台阶', mode: 'walk', p: [18, 0, 15.5], yaw: .12, pitch: .06,
    d: '整座馆坐落在罗马洞石铺成的基座上。没有正面大门，从侧面的台阶登上平台，路线要转几次弯才进入室内。' },
  { n: '大水池', mode: 'walk', p: [24.5, 1.06, 6.6], yaw: 1.42, pitch: -.04,
    d: '开敞庭院里的浅水池。平静的水面倒映着墙体和屋檐，北侧是一道长长的洞石墙，墙前有一条石凳。' },
  { n: '十字柱', mode: 'walk', p: [8.6, 1.06, 5.6], yaw: 1.66, pitch: .06,
    d: '屋顶由八根十字形截面的镀铬钢柱承托，墙体不承重，因此可以在柱网里自由布置。室内外的空间就这样连成一片。' },
  { n: '缟玛瑙墙', mode: 'walk', p: [-8.6, 1.06, 6.2], yaw: 0, pitch: .05,
    d: '一面独立的金色缟玛瑙墙，石料来自阿特拉斯山脉，左右对开纹拼接。据记载，室内净高就是按这块石料的高度定的。' },
  { n: '巴塞罗那椅', mode: 'walk', p: [-6.2, 1.06, 3.4], yaw: .75, pitch: -.32,
    d: '专为这座馆设计的巴塞罗那椅和脚凳：镀铬钢 X 形框架，白色皮革软垫，摆在黑色地毯上，旁边是玻璃面的 X 形茶几。' },
  { n: '光墙', mode: 'walk', p: [-.6, 1.06, -1.2], yaw: .1, pitch: .02,
    d: '两层磨砂玻璃之间藏着光源的发光墙。白天看上去像一块乳白色的石材，到了晚上整面墙会亮起来。' },
  { n: '雕塑《黎明》', mode: 'walk', p: [-17.4, 1.06, -.6], yaw: .5, pitch: .08,
    d: '小水池一角立着格奥尔格·科尔贝的青铜雕塑《黎明》（Der Morgen）。三面是深绿色的蒂诺斯大理石墙，池底铺黑色玻璃。' },
  { n: '俯瞰平面', mode: 'orbit', t: [-1, 0, 0], r: 62, th: 0, ph: .02, roofOff: true,
    d: '揭开屋顶从上往下看：墙体彼此不相交，在柱网之间自由穿插，屋顶只是一块薄板，空间在墙与墙之间流动。' },
];
const UI_TEXT = SPOTS.map(s => s.n + s.d).join('') + '巴塞罗那德国馆按原设计比例的近似重建可自由走进室内全景';
(() => {
  const l = document.createElement('link'); l.rel = 'stylesheet';
  l.href = `https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600&family=Cormorant+Garamond:ital,wght@1,500&display=swap&text=${encodeURIComponent([...new Set(UI_TEXT + 'LudwigMiesvanderRohe·1929AbcdefghijklmnopqrstuvwxyzDM')].join(''))}`;
  document.head.appendChild(l);
})();

/* ================= renderer ================= */
const V3 = THREE.Vector3, TAU = Math.PI * 2;
const canvas = document.getElementById('gl');
const coarse = matchMedia('(pointer:coarse)').matches;
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, coarse ? 1.6 : 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.physicallyCorrectLights = false;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, .05, 4000);
const maxAniso = renderer.capabilities.getMaxAnisotropy();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
let seedN = 12345; const rnd = () => { seedN = (seedN * 16807) % 2147483647; return (seedN - 1) / 2147483646; };
const rand = (a, b) => a + rnd() * (b - a);

/* ================= tileable value noise ================= */
function makePerm(seed) {
  const p = new Uint8Array(512), a = [...Array(256).keys()]; let s = seed;
  for (let i = 255; i > 0; i--) { s = (s * 16807) % 2147483647; const j = s % (i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  for (let i = 0; i < 512; i++) p[i] = a[i & 255];
  return p;
}
function noise2(P, x, y, per) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const m = v => ((v % per) + per) % per;
  const i0 = m(xi), i1 = m(xi + 1), j0 = m(yi), j1 = m(yi + 1);
  const h = (i, j) => P[P[i & 255] + (j & 255)] / 255;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(h(i0, j0), h(i1, j0), u), lerp(h(i0, j1), h(i1, j1), u), v);
}
function fbm(P, x, y, oct, per) {
  let s = 0, a = .5, f = 1, n = 0;
  for (let o = 0; o < oct; o++) { s += a * noise2(P, x * f, y * f, per * f); n += a; a *= .5; f *= 2; }
  return s / n;
}
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const hex = h => { const c = new THREE.Color(h); return [c.r * 255, c.g * 255, c.b * 255]; };
function genCanvas(w, h, fn) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'), img = g.createImageData(w, h), d = img.data;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const [r, gg, b] = fn(x / w, y / h); const i = (y * w + x) * 4; d[i] = r; d[i + 1] = gg; d[i + 2] = b; d[i + 3] = 255; }
  g.putImageData(img, 0, 0); return c;
}
function tex(c, opts = {}) {
  const t = new THREE.CanvasTexture(c); t.encoding = opts.linear ? THREE.LinearEncoding : THREE.sRGBEncoding; t.anisotropy = Math.min(8, maxAniso);
  t.wrapS = t.wrapT = opts.mirror ? THREE.MirroredRepeatWrapping : THREE.RepeatWrapping; return t;
}
// height canvas -> tangent-space normal map
function normalFrom(c, strength) {
  const w = c.width, h = c.height, src = c.getContext('2d').getImageData(0, 0, w, h).data;
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const g = out.getContext('2d'), img = g.createImageData(w, h), d = img.data;
  const H = (x, y) => src[(((y + h) % h) * w + ((x + w) % w)) * 4] / 255;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const dx = (H(x + 1, y) - H(x - 1, y)) * strength, dy = (H(x, y + 1) - H(x, y - 1)) * strength;
    const l = Math.hypot(dx, dy, 1), i = (y * w + x) * 4;
    d[i] = (-dx / l * .5 + .5) * 255; d[i + 1] = (dy / l * .5 + .5) * 255; d[i + 2] = (1 / l * .5 + .5) * 255; d[i + 3] = 255;
  }
  g.putImageData(img, 0, 0); return out;
}

/* ================= stone, water and leather ================= */
const TX = {};
function makeTextures() {
  const P1 = makePerm(7), P2 = makePerm(31), P3 = makePerm(77), P4 = makePerm(123);
  // Roman travertine: warm beige, layered along the bedding, with small open pores
  const trav = genCanvas(1024, 1024, (u, v) => {
    const band = fbm(P1, u * 3, v * 26, 5, 64), cloud = fbm(P2, u * 4, v * 4, 4, 16);
    let c = mixc(hex('#e6d9be'), hex('#c8b18a'), smooth(.34, .78, band));
    c = mixc(c, hex('#f0e6d2'), smooth(.55, .8, cloud) * .45);
    const streak = Math.pow(Math.abs(Math.sin((v * 34 + fbm(P3, u * 2, v * 2, 3, 8) * 6) * Math.PI)), 18);
    return mixc(c, hex('#b49a72'), streak * .35);
  });
  { const g = trav.getContext('2d');
    for (let i = 0; i < 2600; i++) { const x = rnd() * 1024, y = rnd() * 1024, w = rand(2, 12), hh = rand(.8, 2.4); g.fillStyle = `rgba(${110 + rnd() * 30},${90 + rnd() * 20},${60 + rnd() * 20},${rand(.25, .6)})`; g.beginPath(); g.ellipse(x, y, w, hh, rand(-.08, .08), 0, TAU); g.fill(); }
  }
  TX.travFloor = (() => {        // 2 x 2 slabs with joints
    const c = document.createElement('canvas'); c.width = c.height = 1024; const g = c.getContext('2d');
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { g.save(); g.translate(i * 512 + (i ? 512 : 0), j * 512); g.scale(i ? -1 : 1, 1); g.drawImage(trav, j * 300, i * 260, 520, 520, 0, 0, 512, 512); g.restore(); }
    g.strokeStyle = 'rgba(120,102,76,.55)'; g.lineWidth = 3; for (let k = 0; k <= 2; k++) { g.beginPath(); g.moveTo(k * 512, 0); g.lineTo(k * 512, 1024); g.stroke(); g.beginPath(); g.moveTo(0, k * 512); g.lineTo(1024, k * 512); g.stroke(); }
    return c;
  })();
  TX.trav = trav;
  // golden onyx from the Atlas mountains: wavy translucent bands
  TX.onyx = genCanvas(1024, 1024, (u, v) => {
    const warp = fbm(P2, u * 1.4, v * 1.4, 5, 8) * 2.2, t = v * 3.4 + u * .6 + warp;
    const s = .5 + .5 * Math.sin(t * TAU), fine = .5 + .5 * Math.sin(t * TAU * 7.1 + fbm(P3, u * 6, v * 6, 3, 16) * 4);
    let c = mixc(hex('#c4883a'), hex('#e2b46a'), smooth(.1, .75, s));
    c = mixc(c, hex('#f5e1b6'), smooth(.7, .98, s) * .8);
    c = mixc(c, hex('#fff4dc'), Math.pow(fine, 12) * .35);
    const cloud = fbm(P4, u * 2.5, v * 2.5, 4, 8); c = mixc(c, hex('#9a6224'), smooth(.6, .85, cloud) * .3);
    c = mixc(c, hex('#f0d9a8'), smooth(.55, .8, fbm(P1, u * 5, v * 5, 3, 16)) * .25);
    return c;
  });
  // green Tinian marble (verde antico): dark green with a net of pale veins
  TX.verde = genCanvas(1024, 1024, (u, v) => {
    const m = fbm(P1, u * 3, v * 3, 5, 16), r1 = 1 - Math.abs(fbm(P3, u * 2.4, v * 2.4, 5, 8) * 2 - 1), r2 = 1 - Math.abs(fbm(P4, u * 5, v * 5, 4, 16) * 2 - 1);
    let c = mixc(hex('#12251c'), hex('#22432f'), smooth(.35, .7, m));
    c = mixc(c, hex('#0a1510'), smooth(.62, .8, fbm(P2, u * 9, v * 9, 3, 32)) * .4);
    c = mixc(c, hex('#b8d2bd'), smooth(.968, .993, r1) * .95);
    c = mixc(c, hex('#5f8a70'), smooth(.975, .995, r2) * .7);
    c = mixc(c, hex('#d9e6da'), smooth(.985, .998, 1 - Math.abs(fbm(P1, u * 9, v * 9, 3, 32) * 2 - 1)) * .5);
    return c;
  });
  // ripples for the pools (height -> normal)
  const PW = makePerm(5);
  const ripple = genCanvas(512, 512, (u, v) => { const h = fbm(PW, u * 6, v * 6, 4, 6); return [h * 255, h * 255, h * 255]; });
  TX.waterN = normalFrom(ripple, 6);
  // tufted white leather: square cushions sewn into a grid with buttons
  TX.leather = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d');
    g.fillStyle = '#efe8dc'; g.fillRect(0, 0, 512, 512);
    const n = 4, s = 512 / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      const r = g.createRadialGradient(i * s + s / 2, j * s + s / 2, s * .05, i * s + s / 2, j * s + s / 2, s * .72);
      r.addColorStop(0, '#fbf7f0'); r.addColorStop(.7, '#ebe3d5'); r.addColorStop(1, '#cfc5b4');
      g.fillStyle = r; g.fillRect(i * s + 2, j * s + 2, s - 4, s - 4);
    }
    g.strokeStyle = '#b9ad98'; g.lineWidth = 3; for (let k = 0; k <= n; k++) { g.beginPath(); g.moveTo(k * s, 0); g.lineTo(k * s, 512); g.stroke(); g.beginPath(); g.moveTo(0, k * s); g.lineTo(512, k * s); g.stroke(); }
    g.fillStyle = '#a69a85'; for (let i = 0; i <= n; i++) for (let j = 0; j <= n; j++) { g.beginPath(); g.arc(i * s, j * s, 6, 0, TAU); g.fill(); }
    return c;
  })();
  TX.leatherN = (() => { const c = document.createElement('canvas'); c.width = c.height = 512; const g = c.getContext('2d'); const n = 4, s = 128; g.fillStyle = '#000'; g.fillRect(0, 0, 512, 512); for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const r = g.createRadialGradient(i * s + s / 2, j * s + s / 2, 0, i * s + s / 2, j * s + s / 2, s * .7); r.addColorStop(0, '#fff'); r.addColorStop(1, '#000'); g.fillStyle = r; g.fillRect(i * s, j * s, s, s); } return normalFrom(c, 5); })();
  // black carpet with a faint weave
  TX.carpet = genCanvas(256, 256, (u, v) => { const n = fbm(P2, u * 32, v * 32, 2, 32); const l = 14 + n * 14; return [l, l, l + 2]; });
  // plaster for the soffit
  TX.plaster = genCanvas(256, 256, (u, v) => { const n = fbm(P1, u * 16, v * 16, 3, 16); const l = 236 + n * 14; return [l, l - 1, l - 4]; });
  // grass and gravel for the site
  TX.grass = genCanvas(256, 256, (u, v) => { const n = fbm(P3, u * 24, v * 24, 4, 24), m = fbm(P4, u * 4, v * 4, 3, 4); return mixc(hex('#3e5f2c'), hex('#6f8f45'), smooth(.25, .8, n * .7 + m * .3)); });
  TX.gravel = genCanvas(256, 256, (u, v) => { const n = fbm(P2, u * 64, v * 64, 2, 64); return mixc(hex('#a49884'), hex('#d1c6b2'), n); });
}

/* ================= materials ================= */
const MAT = {};
function makeMaterials() {
  const std = o => new THREE.MeshStandardMaterial(o);
  const t = (c, rx, ry, o) => { const x = tex(c, o); x.repeat.set(rx, ry); return x; };
  MAT.travFloor = std({ map: t(TX.travFloor, 1, 1), roughness: .62, metalness: 0 });
  MAT.trav = std({ map: t(TX.trav, 1, 1, { mirror: true }), roughness: .58, metalness: 0 });
  MAT.onyx = std({ map: t(TX.onyx, 1, 1, { mirror: true }), roughness: .12, metalness: 0, envMapIntensity: 1.1, emissive: 0x000000 });
  MAT.verde = std({ map: t(TX.verde, 1, 1, { mirror: true }), roughness: .14, metalness: 0, envMapIntensity: 1.2 });
  MAT.chrome = std({ color: 0xf2f4f6, metalness: 1, roughness: .07, envMapIntensity: 1.4 });

      const fl = floorAt(WALK.pos.x, WALK.pos.z); WALK.floorY = lerp(WALK.floorY, fl, 1 - Math.exp(-dt * 10));
      WALK.pos.y = WALK.floorY + 1.6 + Math.sin(time * 7) * (Math.abs(f) + Math.abs(s) > 0 ? .012 : 0);
    }
    camera.position.copy(WALK.pos); camera.rotation.set(WALK.pitch, WALK.yaw, 0, 'YXZ');
  }
  // water and curtain
  for (const w of WATER) { const m = w.material.normalMap; if (m) { m.offset.x = time * .008; m.offset.y = time * .005; } }
  if (CURTAIN) { const a = CURTAIN.geometry.attributes.position, b = CURTAIN.userData.base; for (let i = 0; i < a.count; i++) { const x = b[i * 3], y = b[i * 3 + 1]; a.setZ(i, b[i * 3 + 2] + Math.sin(x * 2 + time * .8) * .012 * (1 - (y + 1.5) / 3)); } a.needsUpdate = true; }
  sky.position.copy(camera.position);
}
function frame(t) { const dt = Math.min(.05, (t - last) / 1000); last = t; step(dt); renderer.render(scene, camera); requestAnimationFrame(frame); }

/* ================= boot ================= */
const ld = document.getElementById('ldmsg');
const tick = () => new Promise(r => setTimeout(r, 30));
async function boot() {
  resize();
  ld.textContent = '正在打磨石材…'; await tick();
  makeTextures();
  ld.textContent = '正在搭建…'; await tick();
  makeMaterials(); buildPavilion(); planting(); nightLights();
  sun.target.position.set(-4, 0, 0);
  applyEnv(); setTime('day');
  setMode('orbit', true); goSpot(SPOTS[0]);
  const el = document.getElementById('loading'); el.style.opacity = 0; setTimeout(() => el.remove(), 800);
  requestAnimationFrame(t => { last = t; frame(t); });
}
window.__pav = { step, render: () => renderer.render(scene, camera), goSpot, SPOTS, setTime, camera, WALK, scene, renderer, MAT };
boot();
})();
</script>
