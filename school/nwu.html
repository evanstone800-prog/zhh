const ray = new THREE.Raycaster();
function dblTap(x, y) {

addEventListener('keydown', e => { if (e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return; WALK.keys.add(e.code); if (S.mode === 'walk' && ['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault(); if ('KeyW KeyA KeyS KeyD ArrowUp ArrowDown ArrowLeft ArrowRight'.includes(e.code) && S.mode === 'orbit') setMode('walk'); });

// joystick and up/down buttons for phones
(() => {
  const j = document.getElementById('joy'), knob = j.querySelector('i'); let id = null;
  const mv = e => { const r = j.getBoundingClientRect(), x = (e.clientX - r.left - r.width / 2) / (r.width / 2), y = (e.clientY - r.top - r.height / 2) / (r.height / 2), l = Math.max(1, Math.hypot(x, y)); WALK.joy.x = x / l; WALK.joy.y = y / l; knob.style.transform = `translate(${WALK.joy.x * 34}px,${WALK.joy.y * 34}px)`; };

/* ================= tour spots ================= */

  { n: '北区宿舍', mode: 'orbit', t: [-20, 8, -410], r: 200, th: 2.7, ph: 1.0 },

function goSpot(s) {
  document.querySelectorAll('#spots button').forEach(b => b.classList.toggle('on', b.textContent === s.n));

    if (S.mode !== 'orbit') setMode('orbit');
    ORB.ttarget.set(...s.t); ORB.tr = s.r; let th = s.th; while (th - ORB.theta > Math.PI) th -= Math.PI * 2; while (th - ORB.theta < -Math.PI) th += Math.PI * 2; ORB.ttheta = th; ORB.tphi = s.ph;

    fly = { t: 0, from, to: p, yaw0: Math.atan2(-d.x, -d.z), pitch0: Math.asin(d.y), yaw1: s.yaw, pitch1: s.pitch };

}
function showPlace(n) { const el = document.getElementById('place'); el.textContent = n; el.style.opacity = 1; clearTimeout(showPlace.t); showPlace.t = setTimeout(() => { el.style.opacity = 0; }, 1800); }
const spotsEl = document.getElementById('spots');
for (const s of SPOTS) { const b = document.createElement('button'); b.textContent = s.n; b.addEventListener('click', () => goSpot(s)); spotsEl.appendChild(b); }
document.getElementById('mOrbit').addEventListener('click', () => setMode('orbit'));
document.getElementById('mWalk').addEventListener('click', () => setMode('walk'));
document.querySelectorAll('[data-t]').forEach(b => b.addEventListener('click', () => setTime(b.dataset.t)));
document.getElementById('lblBtn').addEventListener('click', e => { S.labels = !S.labels; e.currentTarget.setAttribute('aria-pressed', String(S.labels)); labelsEl.hidden = !S.labels; });

/* ================= floating labels ================= */
const labelsEl = document.getElementById('labels');
function makeLabels() { for (const l of LABELS) { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = l.text; labelsEl.appendChild(d); l.el = d; } }
const _v = new V3();
function updateLabels() {
  if (!S.labels) return;
  const w = innerWidth, h = innerHeight;
  for (const l of LABELS) {
    _v.copy(l.p).project(camera);
    const dist = camera.position.distanceTo(l.p);
    const maxD = S.mode === 'orbit' ? Math.max(300, ORB.r * 1.6) : 260; const vis = _v.z < 1 && Math.abs(_v.x) < 1.1 && Math.abs(_v.y) < 1.1 && dist < maxD && dist > 8;
    if (!vis) { if (l.on !== false) { l.el.style.opacity = 0; l.on = false; } continue; }
    l.on = true; l.el.style.opacity = clamp((maxD - dist) / (maxD * .25), 0, 1);
    l.el.style.transform = `translate(${(_v.x * .5 + .5) * w}px,${(-_v.y * .5 + .5) * h}px) translate(-50%,-100%)`;
  }
}

/* ================= loop ================= */
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize);
let last = performance.now(), time = 0;
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function step(dt) {

    a.needsUpdate = true; FLAG.geometry.computeVertexNormals();
  }
  const near = TEACH_BOXES.some(([a, b, c, d]) => Math.hypot(Math.max(a - camera.position.x, 0, camera.position.x - c), Math.max(b - camera.position.z, 0, camera.position.z - d)) < 150) && camera.position.y < 80;
  for (const m of INTERIOR_INST) m.visible = near;
  if (near && FANS.mesh && S.time !== 'dusk') {
    FANS.forEach((f, i) => { f.a += dt * f.s; _o.position.set(f.x, f.y, f.z); _o.rotation.set(0, f.a, 0); _o.scale.setScalar(1); _o.updateMatrix(); FANS.mesh.setMatrixAt(i, _o.matrix); });
    FANS.mesh.instanceMatrix.needsUpdate = true;
  }

  for (const o of SPIN) o.rotation.y += dt * .25;
  clouds.children.forEach((c, i) => { c.position.x += dt * (4 + i % 3); if (c.position.x > 2200) c.position.x = -2200; });

  sky.position.copy(camera.position);
}
function frame(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t;
  step(dt);
  renderer.render(scene, camera);

}
window.__campus = { step, render: () => { renderer.render(scene, camera); updateLabels(); }, goSpot, SPOTS, setTime, setMode, camera, WALK, ORB, scene };
resize();
const tB = performance.now();

})();
