<html lang="zh-CN"><head><meta charset="utf-8"><title>四季之歌 · 光中的侧脸</title>

<body><canvas id="c"></canvas>
<script>
'use strict';
/* =========================================================

function ridge(g, baseY, amp, freq, seed, col, rough = 0, step = 8) {
  g.fillStyle = col; g.beginPath(); g.moveTo(-10, H + 10);
  for (let x = -10; x <= W + 10; x += step) { const y = baseY - amp * (.5 + .5 * Math.sin(x * freq + seed)) - amp * .35 * Math.sin(x * freq * 2.7 + seed * 1.7) - rough * R(Math.floor(x / step), seed); g.lineTo(x, y); }

}
function cloud(g, x, y, s, c = '255,255,255', a = .9) {
  for (let i = 0; i < 9; i++) { const ox = (R(i, 3) - .5) * 2.2 * s, oy = (R(i, 4) - .6) * .6 * s, r = s * (.45 + R(i, 5) * .5); glow(g, x + ox, y + oy, r, c, a * .55); }

/* ---------- figures ---------- */

  walk: p => ({ t1: .42 * Math.sin(p), k1: Math.max(0, .7 * Math.sin(p + 1.9)), t2: -.42 * Math.sin(p), k2: Math.max(0, .7 * Math.sin(p + 1.9 + Math.PI)), a1: -.38 * Math.sin(p), e1: .25, a2: .38 * Math.sin(p), e2: .25, lean: .04, hipY: -.012 * Math.abs(Math.cos(p)) }),

  sit: () => ({ t1: 1.5, k1: 1.45, t2: 1.42, k2: 1.3, a1: .5, e1: .5, a2: .35, e2: .6, lean: -.06, hipY: .48 }),

  look: () => ({ t1: .03, k1: 0, t2: -.04, k2: 0, a1: .15, e1: .1, a2: -.1, e2: .05, lean: -.12, head: -.35 }),
  sitTable: () => ({ t1: 1.4, k1: 1.4, t2: 1.35, k2: 1.35, a1: 1.1, e1: .5, a2: 1.0, e2: .6, lean: .1, hipY: .2 }),

function figure(g, x, y, s, P, col, o = {}) {

// a person's side-profile head and shoulders, facing right in unit space

  if (o.alpha != null) g.globalAlpha = o.alpha;
  if (o.glowC) { g.shadowColor = rgba(o.glowC, .9); g.shadowBlur = 40; }

  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = col; g.strokeStyle = col;

function hand(g, x, y, s, ang, col, o = {}) {

function blossomBranch(g, x, y, s, dir, t) {
